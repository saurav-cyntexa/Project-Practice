<template>
    <lightning-card title="Dap October 2021 Component" icon-name="custom:custom14">
        <lightning-button 
            slot="actions" 
            label="New" 
            variant="brand" 
            onclick={handleNewRecord}>
        </lightning-button>

        <div style="height: 300px;">
            <c-my-custom-type-datatable 
                key-field="Id" 
                data={tableData} 
                columns={tableColumns}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}>
            </c-my-custom-type-datatable>
        </div>

        <template if:true={showContacts}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <lightning-button-icon icon-name="utility:close"  variant="border-filled" class="slds-button slds-button_icon slds-modal__close" onclick={closeShowContactsModal}></lightning-button-icon>

                    <div class="slds-modal__header">
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">All Contacts Detail</h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <template if:true={contactsList} for:each={contactsList} for:item="con">
                        <div key={con.Id} class="contact-info">
                            <div class="left-side"><img src={con.imageLink} width="100" height="100"/></div>
                            <div class="right-side">
                                    <p>Name: {con.Name}</p>
                                    <p>Phone: {con.Phone}</p>
                                    <p>Email: {con.Email}</p>
                            </div>
                        </div>
                        </template>

        <template if:true={openModelToaddProperty}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open">

                    <div class="slds-modal__header">
                        <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate" tabindex="-1">Add New Property Record</h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                        <lightning-record-form
                            object-api-name="Real_Estate_Property__c"
                            layout-type="Full"
                            onsuccess={handleSuccess}
                            oncancel={handleCancel}
                        >
